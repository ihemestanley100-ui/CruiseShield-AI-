# Render Blueprint for CruiseShield AI (FastAPI backend + Next.js frontend).
# Deploy order is load-bearing (see DEPLOY_ORDER below). Nothing in this file
# provisions or pays for anything by itself. No secrets stored here.
#
# DEPLOY_ORDER:
#   1. Deploy backend first; note its https URL.
#   2. Set the frontend NEXT_PUBLIC_API_BASE_URL to that URL (build-time baked;
#      the frontend MUST be (re)built after the value is set).
#   3. Set backend FRONTEND_ORIGINS to the frontend https URL; redeploy backend.
#   4. Smoke: backend /api/v1/health + frontend / + one cross-origin page.
# Template URLs below use Render's default <service>.onrender.com shape;
# confirm exact hostnames after step 1 and replace before step 2.
services:
  - type: web
    name: cruiseshield-ai
    runtime: docker
    # NOTE: persistent disks require a paid instance type. Starter is the
    # smallest type that supports the disk below. On the free tier, remove
    # the disk block: the app still runs (it re-seeds deterministically on a
    # fresh/empty DATA_DIR) but decisions, runs, and audits will not persist
    # across restarts or instances.
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    disk:
      name: cruiseshield-data
      mountPath: /srv/data
      sizeGB: 1
    envVars:
      - key: MODEL_API_KEY
        sync: false
      - key: META_MODEL_ID
        value: muse-spark-1.3
      - key: META_BASE_URL
        value: https://api.meta.ai/v1
      - key: DATA_DIR
        value: /srv/data
      - key: FRONTEND_ORIGINS
        value: https://cruiseshield-ai-frontend.onrender.com
      # R5 (owner-approved): backend DEMO_WRITE_TOKEN is MANDATORY and
      # PRIVATE. Render prompts at deploy; use a fresh 32+ random value.
      # Empty = write gates open (FORBIDDEN for public). Never copy this
      # value into any frontend variable, file, log, or documentation.
      - key: DEMO_WRITE_TOKEN
        sync: false
      # J3 closeout: protected-demo login secrets (see RENDER_6). Render
      # prompts at deploy. Empty SESSION_SECRET = login disabled
      # (open demo, honest 503 on /auth/login) — set both for staging.
      - key: SESSION_SECRET
        sync: false
      # SEC-ROT: previous secret during rotation overlap; empty otherwise.
      - key: SESSION_SECRET_PREVIOUS
        sync: false
      - key: DEMO_USERS
        sync: false
      # J3 closeout: AI cost controls (defaults match app/config.py).
      - key: AI_DAILY_CALL_LIMIT
        value: 100
      - key: AI_TIMEOUT_SECONDS
        value: 30
      # D-047: per-provider daily ceiling (0 = off; global cap governs).
      - key: AI_PROVIDER_DAILY_LIMIT
        value: 0
      # FRC-001: per-call model output ceiling (sent as max_tokens on
      # analysis + follow-up). 4096 = code default; behavior-neutral.
      # Garbage/zero/negative values fall back to 4096 in code.
      - key: AI_MAX_OUTPUT_TOKENS
        value: 4096
      # ZG-001: storage backend selection (json = default; pg = scratch
      # migration verification only, needs DATABASE_URL which stays unset).
      - key: STORE_BACKEND
        value: json
      # ZG-001: postgres connect timeout, seconds (default 5; garbage/<=0
      # fall back to 5 in code). Inert while STORE_BACKEND=json.
      - key: PG_CONNECT_TIMEOUT
        value: 5
      # Telecom Identity (TEL-06): thresholds + provider secret refs.
      # Secrets stay unset (sync:false) until TEL-08 authorization.
      - key: TELECOM_CONSENT_REQUIRED
        value: 0
      - key: TELECOM_RETENTION_DAYS
        value: 90
      - key: TELECOM_ACTOR_PER_MIN
        value: 30
      - key: TELECOM_SUBJECT_PER_DAY
        value: 20
      - key: CS_CONN_CAMARA_SECRET
        sync: false
      - key: CS_CONN_MTN_KEY
        sync: false
      - key: CS_CONN_HLR_KEY
        sync: false
      # Geointelligence OS (SEC-GEO): quotas + map renderer + intel secrets.
      - key: GEO_ACTOR_PER_MIN
        value: 30
      - key: GEO_SUBJECT_PER_DAY
        value: 20
      - key: GEO_RETENTION_DAYS
        value: 90
      - key: MAP_PROVIDER
        value: none
      - key: CS_CONN_IDENTITY_KEY
        sync: false
      - key: CS_CONN_ADDRESS_KEY
        sync: false
      - key: CS_CONN_IPGEO_KEY
        sync: false
      - key: CS_CONN_GEOCODE_KEY
        sync: false
      - key: CS_CONN_LOCATION_SECRET
        sync: false

  - type: web
    name: cruiseshield-ai-frontend
    runtime: node
    # Free tier sleeps on idle (cold starts); starter keeps the demo warm.
    # Owner decides; demo reliability recommends starter.
    plan: starter
    rootDir: frontend
    # Gate review 11-01: npm ci REQUIRES frontend/package-lock.json IN GIT
    # (J1-committed 2026-11-01 — present in the clone; if ever removed,
    # this build fails loudly).
    buildCommand: npm ci && npm run build
    # Next reads $PORT at start (verified locally on :3110).
    startCommand: npm start -- --port $PORT
    healthCheckPath: /
    envVars:
      # Locally verified 20.19.6; relax to major "20" if the build image
      # lacks this exact patch (failure is loud at build time).
      - key: NODE_VERSION
        value: 20.19.6
      # Build-time baked into client chunks (verified mechanism locally).
      # MUST equal the deployed backend URL from DEPLOY_ORDER step 1.
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://cruiseshield-ai.onrender.com
      # R6 (owner-approved): LEAVE EMPTY for public deploys. No
      # frontend/backend token matching is required or wanted — any
      # value here bakes PUBLIC into browser JS. Protected writes use
      # the login-session flow instead. Empty = header omitted.
      - key: NEXT_PUBLIC_DEMO_WRITE_TOKEN
        sync: false
      # J3 closeout: deployed frontend origin for absolute metadata URLs.
      # NOT a secret. Empty = relative URLs kept (safe default).
      - key: NEXT_PUBLIC_SITE_URL
        value: https://cruiseshield-ai-frontend.onrender.com
