# Render Blueprint for CruiseShield AI (FastAPI backend + Next.js frontend).
# Deploy order is load-bearing (see DEPLOY_ORDER below). Nothing in this file
# provisions or pays for anything by itself. No secrets stored here.
#
# DEPLOY_ORDER:
#   1. Deploy backend first; note its https URL.
#   2. Set the frontend NEXT_PUBLIC_API_BASE_URL to that URL (build-time baked;
#      the frontend MUST be (re)built after the value is set).
#   3. Set backend FRONTEND_ORIGINS to the frontend https URL; redeploy backend.
#   4. Smoke: backend /api/v1/health + frontend / + one cross-origin page.
# Template URLs below use Render's default <service>.onrender.com shape;
# confirm exact hostnames after step 1 and replace before step 2.
services:
  - type: web
    name: cruiseshield-ai
    runtime: docker
    # NOTE: persistent disks require a paid instance type. Starter is the
    # smallest type that supports the disk below. On the free tier, remove
    # the disk block: the app still runs (it re-seeds deterministically on a
    # fresh/empty DATA_DIR) but decisions, runs, and audits will not persist
    # across restarts or instances.
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    disk:
      name: cruiseshield-data
      mountPath: /srv/data
      sizeGB: 1
    envVars:
      - key: MODEL_API_KEY
        sync: false
      - key: META_MODEL_ID
        value: muse-spark-1.3
      - key: META_BASE_URL
        value: https://api.meta.ai/v1
      - key: DATA_DIR
        value: /srv/data
      - key: FRONTEND_ORIGINS
        value: https://cruiseshield-ai-frontend.onrender.com
      # Gap-closure D-002: shared demo write token. Render prompts at
      # deploy. Empty = open demo; set = POSTs require the credential.
      - key: DEMO_WRITE_TOKEN
        sync: false
      # J3 closeout: protected-demo login secrets (see RENDER_6). Render
      # prompts at deploy. Empty SESSION_SECRET = login disabled
      # (open demo, honest 503 on /auth/login) — set both for staging.
      - key: SESSION_SECRET
        sync: false
      - key: DEMO_USERS
        sync: false
      # J3 closeout: AI cost controls (defaults match app/config.py).
      - key: AI_DAILY_CALL_LIMIT
        value: 100
      - key: AI_TIMEOUT_SECONDS
        value: 30

  - type: web
    name: cruiseshield-ai-frontend
    runtime: node
    # Free tier sleeps on idle (cold starts); starter keeps the demo warm.
    # Owner decides; demo reliability recommends starter.
    plan: starter
    rootDir: frontend
    # Gate review 11-01: npm ci REQUIRES frontend/package-lock.json IN GIT
    # (J1-committed 2026-11-01 — present in the clone; if ever removed,
    # this build fails loudly).
    buildCommand: npm ci && npm run build
    # Next reads $PORT at start (verified locally on :3110).
    startCommand: npm start -- --port $PORT
    healthCheckPath: /
    envVars:
      # Locally verified 20.19.6; relax to major "20" if the build image
      # lacks this exact patch (failure is loud at build time).
      - key: NODE_VERSION
        value: 20.19.6
      # Build-time baked into client chunks (verified mechanism locally).
      # MUST equal the deployed backend URL from DEPLOY_ORDER step 1.
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://cruiseshield-ai.onrender.com
      # Gap-closure D-002: MUST equal backend DEMO_WRITE_TOKEN (same
      # owner-generated value in both prompts). PUBLIC once baked into
      # client chunks — demo-staging use only. Empty = header omitted.
      - key: NEXT_PUBLIC_DEMO_WRITE_TOKEN
        sync: false
      # J3 closeout: deployed frontend origin for absolute metadata URLs.
      # NOT a secret. Empty = relative URLs kept (safe default).
      - key: NEXT_PUBLIC_SITE_URL
        value: https://cruiseshield-ai-frontend.onrender.com
